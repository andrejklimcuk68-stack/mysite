<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вкладка {{ current }}</title>

<style>
    @view-transition { navigation: auto; }

    ::view-transition-old(root),
    ::view-transition-new(root) {
        animation-duration: 0.6s;
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
    }

    .bg  { view-transition-name: bg; }
    nav  { view-transition-name: nav; }

    :root {
        --bg: #070816;
        --text: #f1f3ff;
        --muted: #9aa0c8;
        --accent1: #7c5cff;
        --accent2: #00d4ff;
        --accent3: #ff4fd8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }

    .bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background: radial-gradient(circle at 50% 0%, #15184a 0%, var(--bg) 60%);
    }

    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: .55;
        animation: float 18s ease-in-out infinite;
    }
    .blob.b1 { width: 520px; height: 520px; background: var(--accent1); top: -120px; left: -100px; }
    .blob.b2 { width: 460px; height: 460px; background: var(--accent2); bottom: -140px; right: -80px; animation-delay: -6s; }
    .blob.b3 { width: 380px; height: 380px; background: var(--accent3); top: 40%; left: 55%; animation-delay: -12s; opacity: .35; }

    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(80px, 60px) scale(1.15); }
        66%      { transform: translate(-60px, 90px) scale(.9); }
    }

    .grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    }

    nav {
        position: sticky;
        top: 16px;
        z-index: 10;
        margin: 16px auto 0;
        max-width: 96%;
        display: flex;
        gap: 6px;
        padding: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        background: rgba(255, 255, 255, .06);
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 999px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
    }
    nav::-webkit-scrollbar { display: none; }

    nav a {
        flex: 0 0 auto;
        min-width: 44px;
        padding: 10px 16px;
        text-align: center;
        color: var(--muted);
        text-decoration: none;
        font-weight: 600;
        border-radius: 999px;
        transition: color .3s, background .3s, transform .3s;
    }
    nav a:hover {
        color: #fff;
        background: rgba(255, 255, 255, .1);
        transform: translateY(-2px);
    }
    nav a.active {
        color: #fff;
        background: linear-gradient(135deg, var(--accent1), var(--accent2));
        box-shadow: 0 6px 20px rgba(124, 92, 255, .55);
    }

    main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 40px 20px;
    }

    .card {
        width: min(760px, 100%);
        text-align: center;
        padding: 56px 32px;
        background: rgba(255, 255, 255, .06);
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 32px;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
        animation: rise .8s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(40px) scale(.96); filter: blur(8px); }
        to   { opacity: 1; transform: none;               filter: blur(0); }
    }

    .label {
        text-transform: uppercase;
        letter-spacing: .35em;
        font-size: .85rem;
        color: var(--muted);
    }

    .number {
        font-size: clamp(110px, 24vw, 220px);
        font-weight: 800;
        line-height: 1.05;
        background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 6s ease-in-out infinite;
    }
    @keyframes shine {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
    }

    .card p {
        color: var(--muted);
        font-size: 1.1rem;
        margin: 8px 0 32px;
    }

    .buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .buttons a {
        padding: 14px 28px;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, .2);
        background: rgba(255, 255, 255, .07);
        transition: transform .3s, background .3s, box-shadow .3s;
    }
    .buttons a:hover {
        transform: translateY(-4px);
        background: linear-gradient(135deg, var(--accent1), var(--accent2));
        box-shadow: 0 12px 30px rgba(0, 212, 255, .35);
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
    }
</style>
</head>

<body>

    <div class="bg">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="grid"></div>
    </div>

    <nav id="menu">
        {% for n in tabs %}
            <a href="/tab/{{ n }}" class="{{ 'active' if n == current else '' }}">{{ n }}</a>
        {% endfor %}
    </nav>

    {% set total = tabs|length %}
    {% set prev = current - 1 if current > 1 else total %}
    {% set next = current + 1 if current < total else 1 %}

    <main>
        <section class="card">
            <div class="label">Вкладка</div>
            <div class="number">{{ current }}</div>
            <p>Здесь будет содержимое вкладки {{ current }}.</p>
            <div class="buttons">
                <a href="/tab/{{ prev }}">← Назад</a>
                <a href="/tab/{{ next }}">Вперёд →</a>
            </div>
        </section>
    </main>

    <script>
        const active = document.querySelector("nav a.active");
        if (active) active.scrollIntoView({ inline: "center", block: "nearest" });

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") location.href = "/tab/{{ next }}";
            if (e.key === "ArrowLeft")  location.href = "/tab/{{ prev }}";
        });
    </script>

</body>
</html>
